name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-soldr provisions stable (with the runner's rustfmt/clippy) and
      # its zccache-backed build cache (CACHE-025, zackees/ci.yml#209).
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          prebuild-deps-flags: ""
      - name: Check formatting
        run: soldr cargo fmt --all -- --check
      - name: Clippy
        run: soldr cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          prebuild-deps-flags: ""
      - name: Run tests
        run: soldr cargo test --workspace
      - name: Build CLI
        run: soldr cargo build --release -p ctcb-cli

  python:
    name: Python Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # shims: maturin invokes bare `cargo`; the shims route it through
      # soldr so the build uses setup-soldr's zccache build cache.
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          shims: true
          prebuild-deps: none
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install maturin and build
        # --no-install-project + --no-sync: build/install the extension via the
        # maturin CLI directly instead of routing the editable install through
        # the PEP 517 backend. soldr's compile daemon fails to start on macOS
        # runners (soldr backend, 0.7.98), and the backend build would be a
        # redundant second compile anyway. Backend coverage is preserved by the
        # ubuntu-only "PEP 517 backend smoke" step below.
        run: |
          uv sync --no-install-project
          uv run --no-sync maturin develop --release
      - name: Run Python tests
        run: uv run --no-sync pytest python/tests/ -v
      - name: Validate clang-extra build, indexes, query, and install behavior
        run: >-
          uv run --no-sync pytest
          tests/test_clang_extra_builder.py
          tests/test_clang_extra_validator.py
          tests/test_query.py
          tests/test_install.py
          tests/test_api.py -v
      - name: PEP 517 backend smoke (soldr builds the wheel)
        if: matrix.os == 'ubuntu-latest'
        # The backend's own PyPI soldr may differ from setup-soldr's, and only
        # one soldr version can own a cache root: give it an isolated root.
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/pep517-soldr
        run: uv build --wheel

  manifests:
    name: Manifest integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pytest only (no Rust build needed)
        run: uv sync --no-install-project
      - name: Validate binary archive manifests
        run: uv run --no-project --with pytest pytest tests/test_manifest_integrity.py -v

  release-lint:
    name: Release lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate workspace + crate versions before release time
        run: python ci/release_lint.py

  build-wheels:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: true
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
          - os: macos-latest
            target: x86_64-apple-darwin
            zig: false
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            zig: false
    steps:
      - uses: actions/checkout@v4
      # Native lanes route maturin's cargo through setup-soldr's shims and
      # build cache. Cross lanes (zig aarch64, x86_64 on arm64 macOS) skip the
      # shims and build uncached: the compiler wrapper can reuse host-format
      # native C objects (zstd-sys) across target triples (see auto-release.yml).
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          shims: ${{ matrix.cross && 'false' || 'true' }}
          prebuild-deps: none
      - name: Add Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install zig (cross-compile)
        if: matrix.zig
        uses: mlugg/setup-zig@v2
      - name: Build wheel
        # --no-install-project: the wheel is built by the maturin CLI below
        # (which ignores [build-system]); installing the project editable via
        # the soldr PEP 517 backend first is a wasted compile and fails on
        # macOS runners (soldr daemon does not start there — soldr 0.7.98).
        run: |
          uv sync --no-install-project
          uv run --no-sync maturin build --release --target ${{ matrix.target }} ${{ matrix.zig && '--zig' || '' }} --out dist
        shell: bash
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
